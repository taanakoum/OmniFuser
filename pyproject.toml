[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omnifuser-reproduction"
version = "0.1.0"
description = "A reproducible OmniFuser implementation for the Nonastreda tool-wear dataset."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "scipy>=1.12",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
eda = ["matplotlib>=3.8"]

[project.scripts]
omnifuser = "omnifuser.cli:main"

[tool.setuptools.packages.find]
include = ["omnifuser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
